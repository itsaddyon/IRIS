<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
  <title>IRIS – Driver View</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.min.js"></script>
  <style>
    :root {
      --bg: #070a13;
      --card: rgba(15, 23, 42, 0.7);
      --card2: rgba(30, 41, 59, 0.45);
      --border: rgba(255, 255, 255, 0.06);
      --border-focus: rgba(59, 130, 246, 0.4);
      --text: #f8fafc;
      --sub: #94a3b8;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.15);
      --red: #ef4444;
      --orange: #f97316;
      --green: #10b981;
      --yellow: #f59e0b;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
    }

    /* Ambient mesh overlay */
    body::before {
      content: '';
      position: fixed;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.04) 0%, transparent 70%);
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 0;
    }
 
    /* Header */
    header {
      background: rgba(15, 23, 42, 0.85);
      border-bottom: 1px solid var(--border);
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .logo {
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo span {
      color: var(--accent);
    }
    .conn {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--sub);
      font-weight: 500;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
      transition: all 0.2s ease;
    }
    .dot.live {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }
 
    /* Session panel */
    .session-panel {
      position: relative;
      z-index: 1;
      padding: 16px;
      background: rgba(15, 23, 42, 0.4);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
    }
    .session-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .session-info {
      font-size: 0.78rem;
      color: var(--sub);
      font-weight: 500;
    }
    .session-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 2px;
    }
    .timer {
      font-size: 1.5rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text);
      letter-spacing: -0.5px;
    }
    .btns {
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }
    .btn-start {
      background: linear-gradient(135deg, var(--green), #059669);
      color: #fff;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
    }
    .btn-end {
      background: linear-gradient(135deg, var(--red), #b91c1c);
      color: #fff;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
      display: none;
    }
    .btn:active {
      transform: scale(0.96);
    }
 
    /* High alert banner */
    .high-alert {
      display: none;
      margin: 14px 16px;
      background: rgba(239, 68, 68, 0.15);
      border: 1.5px solid var(--red);
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.15);
      animation: pulse 1s infinite alternate;
    }
    .high-alert.show {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .high-alert-title {
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--red);
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .high-alert-sub {
      font-size: 0.8rem;
      color: #fca5a5;
      font-weight: 500;
    }
 
    /* Stats bar */
    .stats {
      position: relative;
      z-index: 1;
      display: flex;
      border-bottom: 1px solid var(--border);
    }
    .stat {
      flex: 1;
      padding: 14px 8px;
      text-align: center;
      border-right: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.2);
    }
    .stat:last-child {
      border-right: none;
    }
    .stat .val {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
    }
    .stat .lbl {
      font-size: 0.65rem;
      color: var(--sub);
      text-transform: uppercase;
      margin-top: 2px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .val.blue { color: var(--accent); } 
    .val.red { color: var(--red); }
    .val.orange { color: var(--orange); } 
    .val.green { color: var(--green); }
 
    /* Detection feed */
    .feed-title {
      padding: 16px 16px 10px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--sub);
    }
    .feed {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 0 16px 100px;
    }
    .det-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      gap: 12px;
      align-items: center;
      transition: border-color 0.2s ease;
    }
    .det-card:hover {
      border-color: rgba(255, 255, 255, 0.08);
    }
    .det-card.High { border-left: 3.5px solid var(--red); }
    .det-card.Medium { border-left: 3.5px solid var(--orange); }
    .det-card.Low { border-left: 3.5px solid var(--green); }
    
    .sev-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    .det-info {
      flex: 1;
      min-width: 0;
    }
    .det-sev {
      font-family: 'Outfit', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
    }
    .det-sev.High { color: var(--red); } 
    .det-sev.Medium { color: var(--orange); } 
    .det-sev.Low { color: var(--green); }
    
    .det-conf {
      font-size: 0.78rem;
      color: var(--sub);
      margin-top: 1px;
    }
    .det-ts {
      font-size: 0.72rem;
      color: var(--sub);
      margin-top: 2px;
    }
    .det-loc {
      font-size: 0.72rem;
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--sub);
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .empty .ico {
      width: 48px;
      height: 48px;
      opacity: 0.3;
      display: flex;
      align-items: center;
      justify-content: center;
    }
 
    /* Bottom nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: rgba(15, 23, 42, 0.9);
      border-top: 1px solid var(--border);
      display: flex;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 100;
    }
    .nav-item {
      flex: 1;
      padding: 14px 8px;
      text-align: center;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--sub);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }
    .nav-item.active {
      color: var(--accent);
    }
    .nav-item .nav-ico {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.7;
    }
    .nav-item.active .nav-ico {
      opacity: 1;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle;">
      <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
      <line x1="4" y1="22" x2="4" y2="15"></line>
    </svg>
    <span>IRIS</span> Mobile
  </div>
  <div class="conn"><div class="dot" id="dot"></div><span id="conn-lbl">Connecting…</span></div>
</header>

<div class="session-panel">
  <div class="session-status">
    <div>
      <div class="session-id" id="sess-id">No active session</div>
      <div class="session-info" id="sess-route">Start inspection to begin</div>
    </div>
    <div class="timer" id="timer" style="display:none">00:00</div>
  </div>
  <div class="btns">
    <button class="btn btn-start" id="btn-start" onclick="startSession()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
      Start Inspection
    </button>
    <button class="btn btn-end"   id="btn-end"   onclick="endSession()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
      End & Upload
    </button>
  </div>
</div>

<!-- High alert -->
<div class="high-alert" id="high-alert">
  <div style="width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; color: var(--red); flex-shrink: 0; margin-top: 2px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
  </div>
  <div>
    <div class="high-alert-title">HIGH SEVERITY POTHOLE!</div>
    <div class="high-alert-sub" id="high-alert-sub">Detected ahead — logged with GPS</div>
  </div>
</div>

<!-- Stats -->
<div class="stats">
  <div class="stat"><div class="val blue" id="m-total">0</div><div class="lbl">Total</div></div>
  <div class="stat"><div class="val red"    id="m-high">0</div><div class="lbl">High</div></div>
  <div class="stat"><div class="val orange" id="m-med">0</div><div class="lbl">Medium</div></div>
  <div class="stat"><div class="val green"  id="m-low">0</div><div class="lbl">Low</div></div>
</div>

<div class="feed-title">Recent Detections</div>
<div class="feed" id="feed">
  <div class="empty">
    <div class="ico">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
    </div>
    Start a session to begin detecting potholes
  </div>
</div>

<div class="bottom-nav">
  <div class="nav-item active">
    <div class="nav-ico">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
    </div>
    Dashboard
  </div>
  <div class="nav-item" onclick="location.href='/live'">
    <div class="nav-ico">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
    </div>
    Full View
  </div>
</div>

<script>
const socket=io();
let total=0,high=0,med=0,low=0,active=false,elapsed=0,timerInt=null;

const pinSvgMobile = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; display: inline-block; margin-right: 4px;"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>`;
const emptySvg = `<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`;
const searchSvg = `<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>`;

socket.on('connect',()=>{
  document.getElementById('dot').className='dot live';
  document.getElementById('conn-lbl').textContent='Connected';
});
socket.on('disconnect',()=>{
  document.getElementById('dot').className='dot';
  document.getElementById('conn-lbl').textContent='Offline';
});

function fmtTime(s){
  const m=Math.floor(s/60),sec=s%60;
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}

function setSessionActive(sessionId, routeLabel, elapsedSec){
  active=true;
  elapsed=elapsedSec||0;
  clearInterval(timerInt);
  document.getElementById('sess-id').textContent='Session: '+sessionId;
  document.getElementById('sess-route').textContent=routeLabel;
  document.getElementById('timer').style.display='block';
  document.getElementById('timer').textContent=fmtTime(elapsed);
  document.getElementById('btn-start').style.display='none';
  document.getElementById('btn-end').style.display='flex';
  timerInt=setInterval(()=>{
    elapsed++;
    document.getElementById('timer').textContent=fmtTime(elapsed);
  },1000);
}

function setSessionInactive(title, subtitle){
  active=false;
  clearInterval(timerInt);
  timerInt=null;
  elapsed=0;
  document.getElementById('sess-id').textContent=title;
  document.getElementById('sess-route').textContent=subtitle;
  document.getElementById('timer').style.display='none';
  document.getElementById('btn-start').style.display='flex';
  document.getElementById('btn-end').style.display='none';
}

function resetFeed(message){
  total=high=med=low=0;
  updateStats();
  document.getElementById('feed').innerHTML=`<div class="empty"><div class="ico">${emptySvg}</div>${message}</div>`;
}

function renderDetection(data){
  total++; const sev=data.severity;
  if(sev==='High'){high++;showHighAlert(data);}
  else if(sev==='Medium') med++;
  else low++;
  updateStats();

  const feed=document.getElementById('feed');
  if(feed.querySelector('.empty')) feed.innerHTML='';
  const card=document.createElement('div');
  card.className=`det-card ${sev}`;
  
  const sevDotColor = {'High':'#ef4444','Medium':'#f97316','Low':'#10b981'};
  const color = sevDotColor[sev] || '#94a3b8';
  const dotHtml = `<span style="width: 10px; height: 10px; border-radius: 50%; background: ${color}; display: block; box-shadow: 0 0 8px ${color};"></span>`;

  card.innerHTML=`
    <div class="sev-icon">${dotHtml}</div>
    <div class="det-info">
      <div class="det-sev ${sev}">${sev} Severity</div>
      <div class="det-conf">${(data.confidence*100).toFixed(1)}% confidence · Area: ${data.area||'—'}px²</div>
      <div class="det-ts">${data.timestamp}</div>
      ${data.location?`<div class="det-loc">${pinSvgMobile} ${data.location}</div>`:''}
    </div>`;
  feed.insertBefore(card,feed.firstChild);
  if(feed.children.length>30) feed.removeChild(feed.lastChild);
}

async function restoreCurrentSession(){
  const status=await fetch('/api/session/status').then(r=>r.json());
  if(!status.active){
    setSessionInactive('No active session', 'Start inspection to begin');
    resetFeed('Start a session to begin detecting potholes');
    return;
  }

  setSessionActive(status.session_id, (status.route||'Field Inspection')+' — Active', status.elapsed||0);
  resetFeed('Restoring live session…');
  const detections=await fetch('/api/session/'+encodeURIComponent(status.session_id)+'/detections').then(r=>r.json());
  if(!detections.length){
    document.getElementById('feed').innerHTML=`<div class="empty"><div class="ico">${searchSvg}</div>Listening for potholes…</div>`;
    return;
  }
  detections.forEach(d=>renderDetection({
    severity:d.severity,
    confidence:d.confidence,
    area:'—',
    timestamp:d.timestamp,
    location:d.location,
  }));
}

async function startSession(){
  const r=await fetch('/api/session/start',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({vehicle_id:'MOBILE-01',route:'Field Inspection'})});
  const d=await r.json();
  if(d.session_id) await restoreCurrentSession();
}

async function endSession(){
  if(!confirm('End session and upload to municipal?')) return;
  await fetch('/api/session/end',{method:'POST'});
  setSessionInactive('Session uploaded','Data sent to Municipal Dashboard');
}

function updateStats(){
  document.getElementById('m-total').textContent=total;
  document.getElementById('m-high').textContent=high;
  document.getElementById('m-med').textContent=med;
  document.getElementById('m-low').textContent=low;
}

socket.on('detection',function(data){
  if(!active) return;
  renderDetection(data);
});

function showHighAlert(data){
  const a=document.getElementById('high-alert');
  document.getElementById('high-alert-sub').innerHTML=
    `Confidence: ${(data.confidence*100).toFixed(1)}%`
    +(data.location?` · ${pinSvgMobile} ${data.location}`:'');
  a.classList.add('show');
  // Vibrate if supported
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
  setTimeout(()=>a.classList.remove('show'),6000);
}

socket.on('session_started', function(status){
  if(status && status.active) restoreCurrentSession();
});

socket.on('session_ended', function(){
  setSessionInactive('Session uploaded','Data sent to Municipal Dashboard');
});

restoreCurrentSession();
</script>
</body>
</html>
