<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agra Road Quality Management System — Authorization</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030712;
      --card: rgba(17, 24, 39, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: #3b82f6;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-glow: rgba(59, 130, 246, 0.2);
      --error: #f43f5e;
      --success: #10b981;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    /* Ambient professional radial backgrounds (SaaS mesh) */
    .bg-mesh {
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 10% 10%, rgba(59, 130, 246, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(99, 102, 241, 0.04) 0%, transparent 40%);
      z-index: 1;
      pointer-events: none;
    }

    .login-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 
        0 4px 30px rgba(0, 0, 0, 0.4),
        0 1px 2px rgba(0, 0, 0, 0.05),
        inset 0 1px 1px rgba(255, 255, 255, 0.05);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .login-container:hover {
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: 
        0 10px 40px rgba(0, 0, 0, 0.5),
        inset 0 1px 1px rgba(255, 255, 255, 0.08);
    }

    /* Brand and Title */
    .header-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
      margin-bottom: 24px;
    }
    .logo-badge {
      font-size: 0.68rem;
      font-weight: 700;
      color: #3b82f6;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      padding: 4px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .title {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      text-align: center;
    }
    .subtitle {
      font-size: 0.84rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 28px;
    }

    /* System Status Message */
    .status-panel {
      background: rgba(17, 24, 39, 0.5);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 24px;
      font-size: 0.78rem;
    }
    .status-content {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }
    .status-dot.pending {
      background: var(--accent);
      animation: pulse 1s infinite alternate;
    }
    .status-dot.success { background: var(--success); }
    .status-dot.error { background: var(--error); }

    .status-txt {
      color: var(--text-muted);
      font-weight: 500;
    }
    .status-txt.success { color: var(--success); }
    .status-txt.error { color: var(--error); }

    @keyframes pulse {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }

    /* Input styling */
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .form-group label {
      display: block;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background: rgba(10, 15, 30, 0.5);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--border-focus);
      background: rgba(10, 15, 30, 0.8);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .form-group input::placeholder {
      color: rgba(255, 255, 255, 0.2);
    }

    .eye-btn {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      padding: 4px;
      transition: color 0.15s ease;
      user-select: none;
      letter-spacing: 0.5px;
    }
    .eye-btn:hover {
      color: var(--text);
    }

    /* Authenticate CTA Button */
    .submit-btn {
      width: 100%;
      padding: 13px 20px;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
      margin-top: 10px;
    }
    .submit-btn:hover:not(:disabled) {
      background: var(--accent-hover);
      box-shadow: 0 6px 16px rgba(59, 130, 246, 0.25);
      transform: translateY(-0.5px);
    }
    .submit-btn:active:not(:disabled) {
      transform: translateY(0);
    }
    .submit-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Sandbox autofill banner (SaaS-like trial banner) */
    .sandbox-banner {
      margin-top: 28px;
      background: rgba(59, 130, 246, 0.03);
      border: 1px dashed rgba(59, 130, 246, 0.2);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .sandbox-info {
      text-align: left;
    }
    .sandbox-title {
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sandbox-title-badge {
      font-size: 0.58rem;
      background: rgba(59, 130, 246, 0.15);
      color: var(--accent);
      padding: 1px 5px;
      border-radius: 4px;
      font-weight: 700;
    }
    .sandbox-details {
      color: var(--text-muted);
      font-size: 0.74rem;
      margin-top: 2px;
    }
    .sandbox-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .sandbox-btn:hover {
      background: var(--accent-hover);
    }

    /* Footer */
    .footer-bar {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.74rem;
      color: var(--text-muted);
    }
    .footer-bar a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s ease;
    }
    .footer-bar a:hover {
      color: #60a5fa;
    }
  </style>
</head>
<body>

<div class="bg-mesh"></div>

<div class="login-container">
  <div class="header-logo">
    <div class="logo-badge">Agra Road System</div>
  </div>
  
  <div class="title">Municipal Officer Portal</div>
  <div class="subtitle">Secure administrative control hub</div>

  <div class="status-panel" id="statusBox">
    <div class="status-content">
      <div class="status-dot pending" id="statusDot"></div>
      <div class="status-txt" id="statusText">Awaiting Operator credentials...</div>
    </div>
  </div>

  <div>
    <!-- Operator ID Input -->
    <div class="form-group">
      <label for="username">Operator ID</label>
      <div class="input-wrapper">
        <span class="input-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </span>
        <input type="text" id="username" placeholder="Enter username" required autofocus autocomplete="off">
      </div>
    </div>
    
    <!-- Security Code Input -->
    <div class="form-group">
      <label for="password">Security Code</label>
      <div class="input-wrapper">
        <span class="input-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </span>
        <input type="password" id="password" placeholder="Enter official PIN" required autocomplete="off">
        <button class="eye-btn" id="togglePasswordBtn" onclick="togglePasswordVisibility()" type="button" tabindex="-1">SHOW</button>
      </div>
    </div>
    
    <button class="submit-btn" id="loginBtn" onclick="doLogin()">Authenticate Portal</button>
  </div>

  <!-- SSO Demonstration Entry -->
  <div class="sandbox-banner">
    <div class="sandbox-info">
      <div class="sandbox-title">
        <span>SSO Demo Access</span>
        <span class="sandbox-title-badge" style="
          font-size: 0.58rem;
          background: rgba(59, 130, 246, 0.1);
          color: var(--accent);
          border: 1px solid rgba(59, 130, 246, 0.15);
          padding: 2px 6px;
          border-radius: 4px;
          font-weight: 700;
          text-transform: uppercase;
        ">Sandbox</span>
      </div>
      <div class="sandbox-details">
        Use automated pre-configured credentials for quick evaluation.
      </div>
    </div>
    <button class="sandbox-btn" onclick="autofillCredentials()" style="
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      color: var(--accent);
      border-radius: 8px;
      padding: 8px 16px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    " onmouseover="this.style.background='var(--accent)'; this.style.color='#fff';" onmouseout="this.style.background='rgba(59, 130, 246, 0.1)'; this.style.color='var(--accent)';">
      Autofill
    </button>
  </div>

  <div class="footer-bar">
    <span>Encrypted Link</span>
    <a href="/live">← Driver Portal</a>
  </div>
</div>

<script>
  // Key bindings
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
  document.getElementById('username').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('password').focus();
  });

  // Toggle PIN visibility
  function togglePasswordVisibility() {
    const pwInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePasswordBtn');
    if (pwInput.type === 'password') {
      pwInput.type = 'text';
      toggleBtn.textContent = 'HIDE';
    } else {
      pwInput.type = 'password';
      toggleBtn.textContent = 'SHOW';
    }
  }

  // Auto-type credentials simulator for showcases
  function autofillCredentials() {
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    
    usernameInput.value = '';
    passwordInput.value = '';
    
    const userStr = 'officer';
    const passStr = 'iris2026';
    
    let u = 0;
    let p = 0;
    
    function typeUsername() {
      if (u < userStr.length) {
        usernameInput.value += userStr.charAt(u);
        u++;
        setTimeout(typeUsername, 40);
      } else {
        setTimeout(typePassword, 100);
      }
    }
    
    function typePassword() {
      if (p < passStr.length) {
        passwordInput.value += passStr.charAt(p);
        p++;
        setTimeout(typePassword, 40);
      } else {
        updateStatus('Credentials loaded. Ready to authenticate.', 'success');
        document.getElementById('loginBtn').focus();
      }
    }
    
    updateStatus('Retrieving sandbox credentials...', 'pending');
    typeUsername();
  }

  // Authenticate logic
  async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const loginBtn = document.getElementById('loginBtn');

    if (!username || !password) {
      updateStatus('Please enter both Operator ID and Security Code.', 'error');
      return;
    }

    updateStatus('Authenticating credentials...', 'pending');
    loginBtn.disabled = true;

    try {
      const response = await fetch('/login/municipal', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await response.json();

      if (data.status === 'ok') {
        updateStatus('Authorization successful. Initializing...', 'success');
        setTimeout(() => { window.location.href = data.redirect; }, 800);
      } else {
        updateStatus('Access Denied. Credentials rejected.', 'error');
        loginBtn.disabled = false;
      }
    } catch (err) {
      updateStatus(`Authentication failed: ${err.message}`, 'error');
      loginBtn.disabled = false;
    }
  }

  function updateStatus(text, type) {
    const statusBox = document.getElementById('statusBox');
    statusBox.innerHTML = `
      <div class="status-content">
        <div class="status-dot ${type}"></div>
        <div class="status-txt ${type}">${text}</div>
      </div>
    `;
  }
</script>
</body>
</html>
